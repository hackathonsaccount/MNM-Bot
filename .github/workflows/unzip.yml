
name: Unzip MNM Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract MNM Bot
        run: |
          unzip -o mnm-bot-main.zip -d mnm-bot-main

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mnm-bot-main
          git diff --cached --quiet || git commit -m "Extract MNM bot archive"
          git push
